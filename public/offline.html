<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - ORION GRAFIKA</title>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #1A231F; color: #BFD5C9; font-family: 'Inter', system-ui, -apple-system, sans-serif;
            text-align: center; padding: 24px;
        }
        .kartu { max-width: 360px; }
        .ikon { font-size: 48px; margin-bottom: 16px; }
        h1 { color: #fff; font-size: 22px; margin: 0 0 8px; }
        p { line-height: 1.6; margin: 0 0 20px; font-size: 15px; }
        button {
            background: #006C7B; color: #fff; border: 0; border-radius: 8px;
            padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        button:hover { background: #005663; }
    </style>
</head>
<body>
    <div class="kartu">
        <div class="ikon">&#128268;</div>
        <h1>Sedang Offline</h1>
        <p>Koneksi internet terputus. Data transaksi terbaru hanya tersedia saat tersambung. Coba sambungkan ulang lalu muat ulang halaman.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
